databaseChangeLog:
  - changeSet:
      id: create-account-table
      author: keiner
      changes:
        - createTable:
            tableName: account
            columns:

              - column:
                  name: account_id
                  type: INT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false

              - column:
                  name: account_number
                  type: VARCHAR(10)
                  constraints:
                    nullable: false
                    unique: true

              - column:
                  name: type_account
                  type: VARCHAR(20)
                  constraints:
                    nullable: false

              - column:
                  name: account_status
                  type: VARCHAR(20)
                  constraints:
                    nullable: false

              - column:
                  name: balance
                  type: DECIMAL(15,2)
                  defaultValueNumeric: 0.00
                  constraints:
                    nullable: false

              - column:
                  name: available_balance
                  type: DECIMAL(15,2)
                  defaultValueNumeric: 0.00
                  constraints:
                    nullable: false

              - column:
                  name: gmf_exempt
                  type: BOOLEAN
                  defaultValueBoolean: true
                  constraints:
                    nullable: false

              - column:
                  name: created_at
                  type: TIMESTAMP
                  constraints:
                    nullable: false

              - column:
                  name: updated_at
                  type: TIMESTAMP
                  constraints:
                    nullable: false

              - column:
                  name: client_id
                  type: INT
                  constraints:
                    nullable: false

              - column:
                  name: user_creation_id
                  type: INT
                  constraints:
                    nullable: false

        - addForeignKeyConstraint:
            baseTableName: account
            baseColumnNames: user_creation_id
            referencedTableName: users
            referencedColumnNames: user_id
            constraintName: fk_account_users

        - addForeignKeyConstraint:
            baseTableName: account
            baseColumnNames: client_id
            referencedTableName: client
            referencedColumnNames: client_id
            constraintName: fk_account_client