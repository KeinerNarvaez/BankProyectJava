databaseChangeLog:
  - changeSet:
      id: 9
      author: keiner
      changes:
        - createTable:
            tableName: transactions
            columns:

              - column:
                  name: transaction_id
                  type: INT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false

              - column:
                  name: transaction_type
                  type: VARCHAR(20)
                  constraints:
                    nullable: false

              - column:
                  name: amount
                  type: DECIMAL(15,2)
                  constraints:
                    nullable: false

              - column:
                  name: transaction_date
                  type: TIMESTAMP
                  constraints:
                    nullable: false

              - column:
                  name: description
                  type: VARCHAR(255)

              - column:
                  name: origin_account_id
                  type: INT

              - column:
                  name: destination_account_id
                  type: INT

              - column:
                  name: user_id
                  type: INT
                  constraints:
                    nullable: false

        - addForeignKeyConstraint:
            baseTableName: transactions
            baseColumnNames: origin_account_id
            referencedTableName: account
            referencedColumnNames: account_id
            constraintName: fk_transaction_origin_account

        - addForeignKeyConstraint:
            baseTableName: transactions
            baseColumnNames: destination_account_id
            referencedTableName: account
            referencedColumnNames: account_id
            constraintName: fk_transaction_destination_account

        - addForeignKeyConstraint:
            baseTableName: transactions
            baseColumnNames: user_id
            referencedTableName: users
            referencedColumnNames: user_id
            constraintName: fk_transaction_user