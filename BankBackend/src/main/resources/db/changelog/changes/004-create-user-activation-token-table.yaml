databaseChangeLog:
  - changeSet:
      id: 4
      author: keiner
      changes:
        - createTable:
            tableName: user_activation_token
            columns:
              - column:
                  name: user_activation_token_id
                  type: INT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
              - column:
                  name: user_id
                  type: INT
                  constraints:
                    nullable: false
                    unique: true
              - column:
                  name: token
                  type: VARCHAR(6)
                  constraints:
                    nullable: false
              - column:
                  name: expire
                  type: DATETIME
                  constraints:
                    nullable: false
              - column:
                  name: used
                  type: BOOLEAN
                  defaultValueBoolean: false
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: DATETIME
                  constraints:
                    nullable: false
        - addForeignKeyConstraint:
            baseTableName: user_activation_token
            baseColumnNames: user_id
            referencedTableName: users
            referencedColumnNames: user_id
            constraintName: fk_user_activation_token_user