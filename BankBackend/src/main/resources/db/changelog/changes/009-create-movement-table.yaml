databaseChangeLog:
  - changeSet:
      id: 10
      author: keiner
      changes:
        - createTable:
            tableName: movement
            columns:

              - column:
                  name: movement_id
                  type: INT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false

              - column:
                  name: amount
                  type: DECIMAL(15,2)
                  constraints:
                    nullable: false

              - column:
                  name: created_at
                  type: TIMESTAMP
                  constraints:
                    nullable: false

              - column:
                  name: description
                  type: VARCHAR(255)

              - column:
                  name: movement_type
                  type: VARCHAR(20)
                  constraints:
                    nullable: false

              - column:
                  name: transaction_id
                  type: INT
                  constraints:
                    nullable: false

              - column:
                  name: account_id
                  type: INT
                  constraints:
                    nullable: false

        - addForeignKeyConstraint:
            baseTableName: movement
            baseColumnNames: transaction_id
            referencedTableName: transactions
            referencedColumnNames: transaction_id
            constraintName: fk_movement_transaction

        - addForeignKeyConstraint:
            baseTableName: movement
            baseColumnNames: account_id
            referencedTableName: account
            referencedColumnNames: account_id
            constraintName: fk_movement_account