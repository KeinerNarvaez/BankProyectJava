server:
  port: 8080

spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:sqlserver://localhost:1433;databaseName=${SQLSERVER_DB};encrypt=true;trustServerCertificate=true}
    username: ${SQLSERVER_USER}
    password: ${SQLSERVER_PASSWORD}
  jpa:
    show-sql: true
  liquibase:
    enabled: true
    change-log: classpath:db/changelog/db.changelog-master.yaml
  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

logging:
  level:
    com.Bank: DEBUG

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui
    enabled: true

app:
  jwt:
    secret: ${JWT_SECRET}
    access-token-expiration: 900000
    refresh-token-expiration: 604800000
  mail:
    from: ${MAIL_USERNAME}
  cors:
    allowed-origins: "http://localhost:3000,http://localhost:5173"
  admin:
    email: ${ADMIN_EMAIL}
    password: ${ADMIN_PASSWORD}